# keys.ini for Guitar Hero III (PS2): the keyboard held like a guitar.
#
# With a normal controller GH3 reads the frets from the shoulder buttons and Cross (found by pressing each one on a green note):
# L2 green, L1 red, R1 yellow, R2 blue, Cross orange, and strums with the D-pad. Here the left hand frets on A S D F G (or 1-5)
# and the right hand strums with the arrow keys (or Enter). Space is Select (star power), Esc is Start (pause).
# A game controller works without this file: left trigger green, L1 red, R1 yellow, right trigger blue, A/Cross orange.
#
# Install: scripts/mac_app.sh gh3 --keys docs/apple/gh3-keys.ini, or copy it over
# ~/Library/Application Support/ps2-native/gh3/keys.ini. Same format as the file the game writes (see its comments).

# strum (and the menus)
dpad_up     = Up, Enter, Keypad Enter
dpad_down   = Down, Right Shift
dpad_left   = Left
dpad_right  = Right

# the frets
l2          = A, 1
l1          = S, 2
r1          = D, 3
r2          = F, 4
cross       = G, 5

# menus: back
circle      = Backspace, E
square      = none
triangle    = none

# star power, pause
select      = Space, Tab
start       = Esc, P

# the sticks are not used for playing; their usual keys would clash with the frets
left_up     = none
left_down   = none
left_left   = none
left_right  = none
right_up    = none
right_down  = none
right_left  = none
right_right = none
l3          = none
r3          = none
roll        = none
rage        = none
help        = none

# picture: AMD FSR 1 to the window's size (4K in full screen on a 4K display), drawn at twice the PS2's resolution
look        = fsr
scale       = 2
